<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小猪佩奇 · 过大年</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(145deg, #d32f2f 0%, #b71c1c 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Comic Sans MS', 'Chalkboard SE', '幼圆', 'Yuanti SC', cursive, sans-serif;
      padding: 16px;
    }

    /* 主卡片 —— 喜庆年味 */
    .new-year-card {
      max-width: 820px;
      width: 100%;
      background: #fef9e7;
      border-radius: 60px 60px 40px 40px;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.5), 0 0 0 8px #ffb300, 0 0 0 12px #d32f2f;
      padding: 30px 20px 40px;
      position: relative;
      overflow: hidden;
      border: 4px solid #ffd54f;
      transition: all 0.2s;
      text-align: center;
    }

    /* 祥云/花纹装饰 */
    .new-year-card::before,
    .new-year-card::after {
      content: "🧧";
      font-size: 3rem;
      position: absolute;
      opacity: 0.6;
      filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.2));
      z-index: 1;
      pointer-events: none;
    }

    .new-year-card::before {
      top: 10px;
      left: 20px;
      transform: rotate(-15deg);
    }

    .new-year-card::after {
      top: 10px;
      right: 20px;
      transform: rotate(15deg);
    }

    /* 标题 */
    .title {
      font-size: 2.6rem;
      font-weight: bold;
      color: #b71c1c;
      text-shadow: 4px 4px 0 #ffd54f, 6px 6px 0 rgba(0, 0, 0, 0.2);
      letter-spacing: 4px;
      margin-top: 0;
      margin-bottom: 8px;
      position: relative;
      z-index: 5;
      transform: rotate(-1deg);
    }

    .sub-title {
      font-size: 1.3rem;
      color: #d84315;
      background: #fff2b0;
      display: inline-block;
      padding: 6px 24px;
      border-radius: 40px;
      border: 3px dashed #e65100;
      margin-bottom: 20px;
      font-weight: bold;
      box-shadow: 0 4px 0 #bf360c;
      letter-spacing: 2px;
      z-index: 5;
      position: relative;
    }

    /* 佩奇和乔治的卡通区域 */
    .peppa-scene {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 20px;
      flex-wrap: wrap;
      margin: 10px 0 10px;
      position: relative;
      z-index: 10;
    }

    /* 每个角色 */
    .pig {
      display: flex;
      flex-direction: column;
      align-items: center;
      filter: drop-shadow(0 12px 8px rgba(0, 0, 0, 0.25));
      transition: transform 0.3s ease;
    }

    .pig:hover {
      transform: scale(1.03);
    }

    /* 佩奇脑袋 */
    .head {
      width: 180px;
      height: 140px;
      background: #fbc1d0;
      border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
      position: relative;
      border: 5px solid #d44b6a;
      box-shadow: inset -8px -8px 0 rgba(0, 0, 0, 0.05), 0 6px 0 #a63a53;
      margin-bottom: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    /* 乔治脑袋稍小 */
    .george .head {
      width: 150px;
      height: 120px;
      background: #fbc1d0;
      border-color: #d44b6a;
    }

    /* 耳朵 */
    .ear {
      position: absolute;
      width: 48px;
      height: 48px;
      background: #fbc1d0;
      border: 5px solid #d44b6a;
      border-radius: 50% 50% 0 0 / 60% 60% 0 0;
      top: -26px;
      z-index: 2;
    }

    .ear.left {
      left: 18px;
      transform: rotate(-30deg);
    }

    .ear.right {
      right: 18px;
      transform: rotate(30deg);
    }

    .george .ear {
      width: 40px;
      height: 40px;
      top: -22px;
    }

    /* 眼睛 */
    .eye {
      position: absolute;
      width: 28px;
      height: 28px;
      background: white;
      border-radius: 50%;
      top: 45px;
      border: 3px solid #4a2e1e;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .eye.left {
      left: 40px;
    }

    .eye.right {
      right: 40px;
    }

    .george .eye {
      width: 24px;
      height: 24px;
      top: 38px;
    }

    .george .eye.left {
      left: 32px;
    }

    .george .eye.right {
      right: 32px;
    }

    .pupil {
      width: 12px;
      height: 12px;
      background: #1e1e1e;
      border-radius: 50%;
      position: relative;
      top: 0;
      left: 0;
    }

    .george .pupil {
      width: 10px;
      height: 10px;
    }

    /* 腮红 */
    .blush {
      position: absolute;
      width: 30px;
      height: 18px;
      background: #f78fa7;
      border-radius: 50%;
      bottom: 28px;
      opacity: 0.7;
      filter: blur(2px);
    }

    .blush.left {
      left: 16px;
    }

    .blush.right {
      right: 16px;
    }

    /* 鼻子 (猪鼻子) */
    .snout {
      position: absolute;
      width: 70px;
      height: 50px;
      background: #f9a8b8;
      border-radius: 50% / 60% 60% 40% 40%;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      border: 4px solid #d44b6a;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      box-shadow: inset 0 -4px 0 #d44b6a;
    }

    .george .snout {
      width: 58px;
      height: 42px;
      gap: 8px;
      bottom: 8px;
    }

    .nostril {
      width: 14px;
      height: 14px;
      background: #d44b6a;
      border-radius: 50%;
      box-shadow: inset 0 0 0 2px #b0304a;
    }

    .george .nostril {
      width: 12px;
      height: 12px;
    }

    /* 嘴巴微笑 (可选) */
    .mouth {
      position: absolute;
      width: 34px;
      height: 16px;
      border-bottom: 5px solid #b0304a;
      border-radius: 0 0 30px 30px;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
      display: none; /* 佩奇通常只看到鼻子，笑可以用腮红表示，此处隐藏保持干净 */
    }

    /* 身体 / 红衣 */
    .body {
      width: 120px;
      height: 80px;
      background: #e63946;
      border-radius: 50% 50% 30% 30% / 60% 60% 40% 40%;
      margin-top: -12px;
      border: 5px solid #b71c1c;
      box-shadow: 0 8px 0 #8b1a1a, inset 0 -6px 0 #a52a2a;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .george .body {
      width: 100px;
      height: 68px;
      background: #f4a261; /* 乔治穿橙色衣服，更活泼 */
      border-color: #c46b2e;
      box-shadow: 0 8px 0 #a0521a;
    }

    /* 肚子上写福字 */
    .fu {
      font-size: 32px;
      font-weight: bold;
      color: #ffd966;
      text-shadow: 2px 2px 0 #b71c1c;
      background: #d32f2f;
      padding: 4px 12px;
      border-radius: 30px;
      transform: rotate(4deg);
      border: 2px solid #ffb300;
      font-family: 'KaiTi', '楷体', 'STKaiti', serif;
      letter-spacing: 2px;
    }

    .george .fu {
      font-size: 24px;
      padding: 2px 10px;
      background: #b84a1a;
      color: #ffdb9e;
    }

    /* 小脚 */
    .feet {
      display: flex;
      gap: 24px;
      margin-top: -4px;
    }

    .foot {
      width: 32px;
      height: 22px;
      background: #e63946;
      border-radius: 50% 50% 40% 40% / 70% 70% 30% 30%;
      border: 4px solid #b71c1c;
      box-shadow: 0 4px 0 #8b1a1a;
    }

    .george .foot {
      width: 26px;
      height: 18px;
      background: #f4a261;
      border-color: #c46b2e;
      box-shadow: 0 4px 0 #a0521a;
    }

    /* 灯笼 / 装饰 */
    .lantern-area {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 16px 0 8px;
      font-size: 2.2rem;
      line-height: 1;
      position: relative;
      z-index: 9;
    }

    .lantern {
      animation: float 3s infinite ease-in-out;
      filter: drop-shadow(0 8px 6px #a00);
    }

    .lantern:nth-child(2) {
      animation-delay: 0.6s;
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(-3deg); }
      50% { transform: translateY(-8px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(-3deg); }
    }

    /* 鞭炮/糖果 */
    .firecracker {
      font-size: 2rem;
      letter-spacing: 8px;
      margin-top: 10px;
      filter: drop-shadow(0 4px 2px #b71c1c);
    }

    /* 新年祝福语 */
    .greeting {
      background: #ffe082;
      border: 6px double #b71c1c;
      border-radius: 80px;
      padding: 16px 20px;
      margin: 24px 0 8px;
      box-shadow: 0 8px 0 #b26a00, inset 0 0 20px #ffb300;
      font-size: 1.8rem;
      font-weight: bold;
      color: #b71c1c;
      letter-spacing: 6px;
      transform: rotate(-1deg);
      position: relative;
      z-index: 12;
    }

    .greeting span {
      display: inline-block;
      animation: bounce 1.2s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-6px); }
    }

    /* 小雪/梅花点缀 */
    .snowflake {
      position: absolute;
      color: #fff9c4;
      font-size: 1.4rem;
      opacity: 0.8;
      animation: twinkle 2s infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: 0.4; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1.2); }
    }

    /* 响应式 */
    @media (max-width: 600px) {
      .title {
        font-size: 1.8rem;
      }
      .head {
        width: 130px;
        height: 105px;
      }
      .eye {
        width: 22px;
        height: 22px;
        top: 35px;
      }
      .eye.left { left: 28px; }
      .eye.right { right: 28px; }
      .snout {
        width: 54px;
        height: 38px;
        bottom: 10px;
      }
      .george .head {
        width: 110px;
        height: 90px;
      }
      .george .snout {
        width: 46px;
        height: 32px;
      }
      .body {
        width: 90px;
        height: 65px;
      }
      .george .body {
        width: 80px;
        height: 55px;
      }
      .greeting {
        font-size: 1.2rem;
        letter-spacing: 2px;
      }
      .fu {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

  <div class="new-year-card">
    <!-- 小雪花装饰 (用梅花/雪点) -->
    <div class="snowflake" style="top: 20px; left: 30px;">❄️</div>
    <div class="snowflake" style="top: 70px; right: 40px; animation-delay: 0.8s;">❄️</div>
    <div class="snowflake" style="bottom: 40px; left: 15px; animation-delay: 0.4s;">🌸</div>
    <div class="snowflake" style="bottom: 80px; right: 20px; animation-delay: 1.2s;">🧧</div>

    <h1 class="title">小猪佩奇过大年</h1>
    <div class="sub-title">🐷 新春快乐 · 诸事顺遂 🐷</div>

    <!-- 佩奇和乔治 -->
    <div class="peppa-scene">
      <!-- 佩奇 -->
      <div class="pig peppa" onclick="playSound('peppa')">
        <div class="head">
          <div class="ear left"></div>
          <div class="ear right"></div>
          <div class="eye left"><div class="pupil"></div></div>
          <div class="eye right"><div class="pupil"></div></div>
          <div class="blush left"></div>
          <div class="blush right"></div>
          <div class="snout">
            <div class="nostril"></div>
            <div class="nostril"></div>
          </div>
        </div>
        <div class="body">
          <div class="fu">福</div>
        </div>
        <div class="feet">
          <div class="foot"></div>
          <div class="foot"></div>
        </div>
      </div>

      <!-- 乔治 -->
      <div class="pig george" onclick="playSound('george')">
        <div class="head">
          <div class="ear left"></div>
          <div class="ear right"></div>
          <div class="eye left"><div class="pupil"></div></div>
          <div class="eye right"><div class="pupil"></div></div>
          <div class="blush left"></div>
          <div class="blush right"></div>
          <div class="snout">
            <div class="nostril"></div>
            <div class="nostril"></div>
          </div>
        </div>
        <div class="body">
          <div class="fu">吉</div>
        </div>
        <div class="feet">
          <div class="foot"></div>
          <div class="foot"></div>
        </div>
      </div>
    </div>

    <!-- 灯笼装饰 -->
    <div class="lantern-area">
      <div class="lantern">🏮</div>
      <div class="lantern">🏮</div>
      <div class="lantern">🏮</div>
    </div>

    <!-- 鞭炮小元素 -->
    <div class="firecracker">
      🧨 🧨 🧨
    </div>

    <!-- 祝福语 -->
    <div class="greeting">
      <span>新</span><span>年</span><span>快</span><span>乐</span>
      <span>🎉</span>
      <span>万</span><span>事</span><span>如</span><span>意</span>
    </div>

    <!-- 隐藏的声音触发器说明（仅视觉） -->
    <p style="margin-top: 18px; color: #a63a53; font-size: 0.9rem; opacity: 0.8;">
      ✨ 戳戳佩奇和乔治，有惊喜哦 ✨
    </p >
  </div>

  <script>
    // 用 Web Audio 简单生成小猪“哼唧”声，增加互动趣味 (无外部音频)
    function playSound(pigType) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;

        const ctx = new AudioContext();

        // 主振荡器
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sawtooth'; // 有点嗡嗡的，像小猪
        // 佩奇声音稍高，乔治稍低
        const baseFreq = pigType === 'peppa' ? 320 : 220;
        osc.frequency.value = baseFreq;

        // 频率 wobble 模仿猪叫“哼”
        const now = ctx.currentTime;
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.linearRampToValueAtTime(baseFreq + 80, now + 0.08);
        osc.frequency.linearRampToValueAtTime(baseFreq - 30, now + 0.15);
        osc.frequency.linearRampToValueAtTime(baseFreq + 40, now + 0.22);

        // 音量包络
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.15, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.08, now + 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.32);

        // 第二个振荡器做轻微和声，更像动物
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.value = baseFreq * 1.5;
        gain2.gain.setValueAtTime(0.001, now);
        gain2.gain.exponentialRampToValueAtTime(0.06, now + 0.02);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now);
        osc2.stop(now + 0.3);

      } catch (e) {
        // 某些浏览器可能限制自动播放，静默失败
        console.warn('小猪哼唧音效播放失败 (需用户交互)', e);
      }
    }

    // 让灯笼也有简单的点击动画 (可选)
    document.querySelectorAll('.lantern').forEach(lantern => {
      lantern.addEventListener('click', () => {
        lantern.style.transform = 'scale(1.3)';
        setTimeout(() => lantern.style.transform = '', 200);
      });
    });
  </script>
</body>
</html>
